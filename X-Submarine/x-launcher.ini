[Setup]
AppName=Submarine
Profile=Default

;-------------------------------------------------
; ** Path syntax **
;-------------------------------------------------
; Nessuna sezione [FileSystem]: si usano i valori di default del motore
;   Root = @ScriptDir@   (la cartella dove sta X-Submarine.exe)
;   Home = .\User        (relativo a Root)
;   Bin  = .\Bin          (relativo a Root)
; Percio' X-Submarine.exe deve stare ALLO STESSO LIVELLO delle cartelle
; Bin\ e User\ (nessuna sottocartella "XDrive" in mezzo) — vedi README.

[FileToRun]
PathToExe=$Bin$\$AppName$\$AppName$.exe
Parameters=

[Environment]
;(redirect del profilo utente dell'app, stile tradizionale HOME + %HOME%)
HOME=$Home$\$AppName$
USERPROFILE=%HOME%\Profile
APPDATA=%HOME%\AppData\Roaming
LOCALAPPDATA=%HOME%\AppData\Local

[FirstRunOperations]
;(al primo avvio, se Submarine.exe manca ancora, scarica ed estrae l'app)
RunFile=$Bin$\$AppName$\Init_Submarine.bat

[Options]
DeleteTemp=true
MultipleIstances=false
RunWait=true
ShowSplash=false
WriteLog=false
FirstRun=true
ShowTrayTip=false

[SplashScreen]
Image=
Title=
TimeOut=1500

[FileSystem]
;(X-Submarine.exe sta in XDrive: Root risale di un livello, cosi'
; $Bin$ e $Home$ puntano a Bin\ e User\ nella radice di winPenPack
; invece che dentro XDrive stesso — di default, senza questa riga,
; $Root$ = @ScriptDir = XDrive, causando percorsi inesistenti e
; l'errore "APP_DATA_DIR_NOT_FOUND" nell'app)
Root=..

[Setup]
AppName=Submarine
Profile=Default

[FileToRun]
PathToExe=$Bin$\$AppName$\Submarine.exe
Parameters=

[Environment]
;(redirect del profilo utente dell'app)
USERPROFILE=$Home$\$AppName$\Profile
APPDATA=$Home$\$AppName$\AppData\Roaming
LOCALAPPDATA=$Home$\$AppName$\AppData\Local

[FirstRunOperations]
;(al primo avvio, se Submarine.exe manca ancora, scarica ed estrae l'app)
RunFile=$Bin$\$AppName$\Init_Submarine.bat

[Options]
DeleteTemp=true
MultipleIstances=false
RunWait=true
ShowSplash=false
WriteLog=false
FirstRun=true
ShowTrayTip=false

[SplashScreen]
Image=
Title=
TimeOut=1500
